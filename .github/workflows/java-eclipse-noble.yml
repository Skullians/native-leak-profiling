name: Build Java (Noble)

on:
    workflow_dispatch:
    schedule:
        - cron: "0 4 * * 1"
    push:
        branches:
            - main
        paths:
            - java-noble/**
            - scripts/**
            - .github/workflows/java-eclipse-noble.yml
            - .github/workflows/build.yml
    pull_request:
        paths:
            - java-noble/**
            - scripts/**
            - .github/workflows/java-eclipse-noble.yml
            - .github/workflows/build.yml

permissions:
    contents: read
    packages: write

concurrency:
    group: "java-noble-${{ github.ref }}"
    cancel-in-progress: true

jobs:
    build:
        uses: ./.github/workflows/build.yml
        with:
            family: java-noble
