name: Build

on:
    workflow_call:
        inputs:
            family:
                description: Image family dir (e.g. java-zulu)s
                required: true
                type: string

env:
    EOL: "24 26" # bye bitches

jobs:
    matrix:
        name: Matrix
        runs-on: ubuntu-24.04
        outputs:
            tags: ${{ steps.scan.outputs.tags }}
            suffix: ${{ steps.scan.outputs.suffix }}

        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Scan Dockerfiles
              id: scan
              env:
                  FAMILY: ${{ inputs.family }}
                  EVENT: ${{ github.event_name }}
              run: |
                  tags=$(find "$FAMILY" -mindepth 2 -maxdepth 2 -name Dockerfile -printf '%h\n' | xargs -n1 basename | sort -V)
                  if [ "$EVENT" = schedule ]; then
                      eol=$(echo "$EOL" | tr ' ' '|')
                      tags=$(echo "$tags" | grep -vE "(^|_)($eol)$" || true)
                  fi
                  suffix=${FAMILY#java}
                  echo "tags=$(jq -Rnc '[inputs | select(length > 0)]' <<< "$tags")" >> "$GITHUB_OUTPUT"
                  echo "suffix=${suffix//-/_}" >> "$GITHUB_OUTPUT"

    build:
        name: "java_${{ matrix.tag }}${{ needs.matrix.outputs.suffix }} (${{ matrix.arch }})"
        needs: matrix
        runs-on: ${{ matrix.runner }}
        timeout-minutes: 60
        strategy:
            fail-fast: false
            matrix:
                tag: ${{ fromJson(needs.matrix.outputs.tags) }}
                arch:
                    - amd64
                    - arm64
                include:
                    - arch: amd64
                      runner: ubuntu-24.04
                    - arch: arm64
                      runner: ubuntu-24.04-arm

        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Setup Buildx
              uses: docker/setup-buildx-action@v4

            - name: Set image name
              run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

            - name: Build
              uses: docker/build-push-action@v7
              with:
                  context: .
                  file: ./${{ inputs.family }}/${{ matrix.tag }}/Dockerfile
                  platforms: linux/${{ matrix.arch }}
                  load: true
                  tags: smoke

            - name: Test
              run: |
                  out=$(docker run --rm -e STARTUP="java -version" smoke 2>&1) || { echo "$out"; exit 1; }
                  echo "$out"
                  if grep -q "cannot be preloaded" <<< "$out"; then
                      echo "::error::Allocator failed to preload"
                      exit 1
                  fi

            - name: Login to registry
              if: github.event_name != 'pull_request'
              uses: docker/login-action@v4
              with:
                  registry: ghcr.io
                  username: ${{ github.repository_owner }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Push
              id: push
              if: github.event_name != 'pull_request'
              uses: docker/build-push-action@v7
              with:
                  context: .
                  file: ./${{ inputs.family }}/${{ matrix.tag }}/Dockerfile
                  platforms: linux/${{ matrix.arch }}
                  outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true

            - name: Export
              if: github.event_name != 'pull_request'
              env:
                  DIGEST: ${{ steps.push.outputs.digest }}
              run: |
                  mkdir -p /tmp/digests
                  touch "/tmp/digests/${DIGEST#sha256:}"

            - name: Upload digest
              if: github.event_name != 'pull_request'
              uses: actions/upload-artifact@v7
              with:
                  name: digests-${{ inputs.family }}-${{ matrix.tag }}-${{ matrix.arch }}
                  path: /tmp/digests/*
                  if-no-files-found: error
                  retention-days: 1

    merge:
        name: "merge java_${{ matrix.tag }}${{ needs.matrix.outputs.suffix }}"
        needs: [matrix, build]
        if: ${{ !cancelled() && needs.matrix.result == 'success' && github.event_name != 'pull_request' }}
        runs-on: ubuntu-24.04
        strategy:
            fail-fast: false
            matrix:
                tag: ${{ fromJson(needs.matrix.outputs.tags) }}
        env:
            TAG: java_${{ matrix.tag }}${{ needs.matrix.outputs.suffix }}

        steps:
            - name: Download digests
              uses: actions/download-artifact@v8
              with:
                  pattern: digests-${{ inputs.family }}-${{ matrix.tag }}-*
                  path: /tmp/digests
                  merge-multiple: true

            - name: Check
              run: |
                  if [ "$(ls /tmp/digests 2>/dev/null | wc -l)" -ne 2 ]; then
                      echo "::error::$TAG is missing an architecture, keeping the previous image"
                      exit 1
                  fi

            - name: Image name
              run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

            - name: Login to registry
              uses: docker/login-action@v4
              with:
                  registry: ghcr.io
                  username: ${{ github.repository_owner }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Create tag
              working-directory: /tmp/digests
              run: docker buildx imagetools create -t "$IMAGE:$TAG" $(printf "$IMAGE@sha256:%s " *)
