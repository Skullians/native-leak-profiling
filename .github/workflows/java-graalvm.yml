name: Build Java GraalVM

on:
    workflow_dispatch:
    push:
        branches:
            - main
        paths:
            - java-graalvm/**
            - scripts/**
            - .github/workflows/java-graalvm.yml
            - .github/workflows/build.yml
    pull_request:
        paths:
            - java-graalvm/**
            - scripts/**
            - .github/workflows/java-graalvm.yml
            - .github/workflows/build.yml

permissions:
    contents: read
    packages: write

concurrency:
    group: "java-graalvm-${{ github.ref }}"
    cancel-in-progress: true

jobs:
    build:
        uses: ./.github/workflows/build.yml
        with:
            family: java-graalvm
